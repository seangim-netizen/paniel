<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c59" />
      <stop offset="100%" stop-color="#2d5a3c" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b07d50" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#f4f7f4" stroke="#d5e0d7" stroke-width="2"/>
  
  <!-- Subtle Olive Branch / Light Rays -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#e0ece2" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Cross in Center -->
  <rect x="46" y="22" width="8" height="52" rx="4" fill="url(#crossGrad)" />
  <rect x="27" y="36" width="46" height="8" rx="4" fill="url(#crossGrad)" />
  
  <!-- Warm Heart Accent -->
  <path d="M50 49 C46 43 38 45 38 52 C38 59 47 65 50 68 C53 65 62 59 62 52 C62 45 54 43 50 49 Z" fill="url(#heartGrad)" opacity="0.9" />
